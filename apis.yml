name: Bionic
description: 'Bionic was the pioneer of Application Security Posture Management (ASPM),
  offering a platform that mapped application architecture, services, and data flows
  in production without requiring source-code access or repository integration, in order
  to eliminate vulnerability noise and prioritize business-critical risk. CrowdStrike
  announced its acquisition of Bionic on September 19, 2023 (estimated $350M) and folded
  the technology into Falcon Cloud Security as its ASPM capability. The bionic.ai domain
  now wildcard-redirects to CrowdStrike; Bionic no longer maintains an independent developer
  portal, API, or documentation surface. This profile is retained as an acquired-company
  lead in the API Evangelist network.'
